<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in — Axis Camera Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1a2a3a;
            border: 1px solid #2a3a4a;
            border-radius: 16px;
            padding: 48px 40px;
            width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-card h1 {
            color: #ffb300;
            font-size: 22px;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-card p {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f1923;
            border: 1px solid #3a4a5a;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #ffb300;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffb300, #ff8f00);
            border: none;
            border-radius: 8px;
            color: #0f1923;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 179, 0, 0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>&#x1f3a5; Axis Camera</h1>
        <p>Logga in för att komma åt dashboarden</p>
        <div class="error" id="error"></div>
        <form id="loginForm">
            <label for="username">Användarnamn</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>
            <label for="password">Lösenord</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit">Logga in</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('error');
            errEl.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();
                if (data.ok) {
                    window.location.href = '/index.html';
                } else {
                    errEl.textContent = data.error || 'Inloggningen misslyckades';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = 'Kunde inte ansluta till servern';
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
