<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Väder i Lund — Axis Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, #1a2a3a, #0d1b2a);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ffb300;
        }
        header h1 { font-size: 24px; color: #ffb300; }
        header a {
            color: #ffb300;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #ffb300;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        header a:hover { background: #ffb300; color: #0f1923; }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }
        .card {
            background: #1a2a3a;
            border-radius: 12px;
            padding: 28px;
            border: 1px solid #2a3a4a;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 16px;
            color: #ffb300;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .current-weather {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .temp-big {
            font-size: 72px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }
        .temp-big .unit { font-size: 32px; color: #888; }
        .weather-icon {
            font-size: 64px;
            line-height: 1;
        }
        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .detail-item {
            background: #0f1923;
            padding: 14px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .detail-item .label { color: #888; font-size: 13px; }
        .detail-item .value { color: #fff; font-weight: 600; font-size: 15px; }
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }
        .forecast-item {
            background: #0f1923;
            border-radius: 10px;
            padding: 14px 10px;
            text-align: center;
        }
        .forecast-item .time { color: #888; font-size: 12px; margin-bottom: 6px; }
        .forecast-item .icon { font-size: 28px; margin-bottom: 4px; }
        .forecast-item .temp { font-size: 18px; font-weight: 700; color: #fff; }
        .forecast-item .wind { font-size: 11px; color: #64b5f6; margin-top: 4px; }
        .forecast-item .rain { font-size: 11px; color: #4caf50; margin-top: 2px; }
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 18px;
        }
        .error-msg {
            background: rgba(244,67,54,0.15);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 14px 18px;
            border-radius: 8px;
        }
        footer {
            background: #0d1b2a;
            border-top: 1px solid #2a3a4a;
            text-align: center;
            padding: 16px;
            color: #888;
            font-size: 13px;
        }
        footer .clock { color: #ffb300; font-weight: 600; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <h1>&#x26C5; Väder i Lund</h1>
        <a href="/index.html">&#x2190; Tillbaka till Dashboard</a>
    </header>

    <div class="container">
        <div class="card" id="currentCard">
            <h2>Just nu</h2>
            <div class="loading" id="loading">Hämtar väderdata från SMHI...</div>
            <div id="currentWeather" style="display:none;">
                <div class="current-weather">
                    <div class="weather-icon" id="currentIcon"></div>
                    <div>
                        <div class="temp-big"><span id="currentTemp">--</span><span class="unit">°C</span></div>
                        <div style="color:#888;margin-top:4px;" id="currentDesc"></div>
                    </div>
                </div>
                <div class="weather-details" id="details"></div>
            </div>
        </div>

        <div class="card">
            <h2>Prognos kommande 24 timmar</h2>
            <div class="forecast-grid" id="forecast"></div>
        </div>
    </div>

    <footer>
        <div class="clock" id="clock"></div>
        <div style="margin-top:6px;">Data från <a href="https://opendata.smhi.se/" style="color:#ffb300;" target="_blank">SMHI Öppna Data</a> &mdash; Lund (55.70°N, 13.19°E)</div>
    </footer>

    <script>
        // SMHI weather symbol mapping
        const weatherSymbols = {
            1: { icon: '☀️', desc: 'Klart' },
            2: { icon: '🌤️', desc: 'Nästan klart' },
            3: { icon: '⛅', desc: 'Halvklart' },
            4: { icon: '🌥️', desc: 'Molnigt' },
            5: { icon: '☁️', desc: 'Mycket moln' },
            6: { icon: '☁️', desc: 'Mulet' },
            7: { icon: '🌫️', desc: 'Dimma' },
            8: { icon: '🌧️', desc: 'Lätta regnskurar' },
            9: { icon: '🌧️', desc: 'Regnskurar' },
            10: { icon: '🌧️', desc: 'Kraftiga regnskurar' },
            11: { icon: '⛈️', desc: 'Åskväder' },
            12: { icon: '🌨️', desc: 'Lätta snöblandade skurar' },
            13: { icon: '🌨️', desc: 'Snöblandade skurar' },
            14: { icon: '🌨️', desc: 'Kraftiga snöblandade skurar' },
            15: { icon: '🌨️', desc: 'Lätta snöskurar' },
            16: { icon: '🌨️', desc: 'Snöskurar' },
            17: { icon: '🌨️', desc: 'Kraftiga snöskurar' },
            18: { icon: '🌧️', desc: 'Lätt regn' },
            19: { icon: '🌧️', desc: 'Regn' },
            20: { icon: '🌧️', desc: 'Kraftigt regn' },
            21: { icon: '⛈️', desc: 'Åska' },
            22: { icon: '🌨️', desc: 'Lätt snöblandat regn' },
            23: { icon: '🌨️', desc: 'Snöblandat regn' },
            24: { icon: '🌨️', desc: 'Kraftigt snöblandat regn' },
            25: { icon: '❄️', desc: 'Lätt snöfall' },
            26: { icon: '❄️', desc: 'Snöfall' },
            27: { icon: '❄️', desc: 'Kraftigt snöfall' },
        };

        function getParam(params, name) {
            const p = params.find(p => p.name === name);
            return p ? p.values[0] : null;
        }

        function windDirection(deg) {
            const dirs = ['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSV','SV','VSV','V','VNV','NV','NNV'];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        async function loadWeather() {
            const url = 'https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/13.191/lat/55.705/data.json';

            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();

                // Current weather = first timeSeries entry
                const now = data.timeSeries[0];
                const params = now.parameters;

                const temp = getParam(params, 't');
                const ws = getParam(params, 'ws');
                const gust = getParam(params, 'gust');
                const wd = getParam(params, 'wd');
                const rh = getParam(params, 'r');
                const msl = getParam(params, 'msl');
                const pmean = getParam(params, 'pmean');
                const tcc = getParam(params, 'tcc_mean');
                const vis = getParam(params, 'vis');
                const wsymb = getParam(params, 'Wsymb2');

                const symbol = weatherSymbols[wsymb] || { icon: '🌡️', desc: 'Okänt' };

                document.getElementById('currentTemp').textContent = Math.round(temp * 10) / 10;
                document.getElementById('currentIcon').textContent = symbol.icon;
                document.getElementById('currentDesc').textContent = symbol.desc;

                const detailsHtml = [
                    { label: 'Vind', value: `${ws} m/s ${windDirection(wd)}` },
                    { label: 'Vindbyar', value: `${gust} m/s` },
                    { label: 'Luftfuktighet', value: `${rh}%` },
                    { label: 'Lufttryck', value: `${msl} hPa` },
                    { label: 'Nederbörd', value: `${pmean} mm/h` },
                    { label: 'Molntäcke', value: `${Math.round(tcc / 8 * 100)}%` },
                    { label: 'Sikt', value: `${(vis / 1000).toFixed(1)} km` },
                ].map(d => `<div class="detail-item"><span class="label">${d.label}</span><span class="value">${d.value}</span></div>`).join('');

                document.getElementById('details').innerHTML = detailsHtml;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('currentWeather').style.display = '';

                // Forecast: next 24 hours (one entry per hour roughly)
                const forecastEntries = data.timeSeries.slice(1, 25);
                const forecastHtml = forecastEntries.map(ts => {
                    const time = new Date(ts.validTime);
                    const h = time.getHours().toString().padStart(2, '0') + ':00';
                    const t = getParam(ts.parameters, 't');
                    const w = getParam(ts.parameters, 'ws');
                    const rain = getParam(ts.parameters, 'pmean');
                    const sym = getParam(ts.parameters, 'Wsymb2');
                    const s = weatherSymbols[sym] || { icon: '🌡️' };
                    return `<div class="forecast-item">
                        <div class="time">${h}</div>
                        <div class="icon">${s.icon}</div>
                        <div class="temp">${Math.round(t)}°</div>
                        <div class="wind">💨 ${w} m/s</div>
                        ${rain > 0 ? `<div class="rain">🌧️ ${rain} mm/h</div>` : ''}
                    </div>`;
                }).join('');
                document.getElementById('forecast').innerHTML = forecastHtml;

            } catch (e) {
                document.getElementById('loading').innerHTML =
                    `<div class="error-msg">Kunde inte hämta väderdata: ${e.message}</div>`;
            }
        }

        // Footer clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleDateString('sv-SE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
                + ' — ' +
                now.toLocaleTimeString('sv-SE');
        }

        updateClock();
        setInterval(updateClock, 1000);
        loadWeather();
        setInterval(loadWeather, 600000); // refresh every 10 min
    </script>
</body>
</html>
